# Deploy Table Manager to FTP. VTT package comes from git (table-manager/current-source,
# produced locally by Husky pre-commit / build.bat). CI only builds TM CSS/JS.
#
# Required GitHub secrets (environment "FTP_SERVER", or repository secrets):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR  (remote dir must end with /)
#
# Optional GitHub variables:
#   FTP_PROTOCOL  ftp | ftps  (default: ftp)
#
# vendor/ and current-source/backend/vendor/ are NOT uploaded — keep them on the
# server (FileZilla) after Composer / build.bat. FTP also leaves public/vtt/user/,
# production .env, and SQLite alone.

name: Deploy Table Manager

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-table-manager
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build TM assets and sync FTP
    runs-on: ubuntu-latest
    environment: FTP_SERVER
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: table-manager/package-lock.json

      - name: Build Table Manager assets
        working-directory: table-manager
        run: |
          npm ci
          npm run build
          rm -rf node_modules tests

      - name: Upload Table Manager via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./table-manager/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          dangerous-clean-slate: false
          timeout: 120000
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            node_modules
            node_modules/**
            **/node_modules/**
            vendor
            vendor/**
            **/vendor/**
            .env
            .env.backup
            .env.production
            **/database/*.sqlite
            **/database/*.sqlite*
            public/vtt/user
            public/vtt/user/**
            **/public/vtt/user
            **/public/vtt/user/**
            **/storage/logs/**
            **/storage/framework/sessions/**
            **/storage/framework/cache/data/**
            bootstrap/cache/config.php
            bootstrap/cache/routes.php
            bootstrap/cache/routes-v7.php
            bootstrap/cache/events.php
            tests
            tests/**
            **/tests/**
            **/.husky/**
            phpunit.xml
            package.json
            package-lock.json
            vite.config.js
            postcss.config.js
            tailwind.config.js
            resources/css/**
            resources/js/**
            README.md
            .editorconfig
            .gitattributes
            .npmrc
